name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify video assets
        shell: bash
        run: |
          ls -lh img/video-splash.mp4 img/video-splash.webm
          for f in img/video-splash.mp4 img/video-splash.webm; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "ERROR: $f is too small ($size bytes)."
              exit 1
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
